<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f1f28" />
    <title>Simone's Portfolio</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link
      rel="preload"
      href="fonts/FiraCode-VF.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" sizes="64x64" href="MF-DOOM.png?v=2" />
    <link href="Srv.Portfolio.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
  </head>

  <body>
    <div id="app">
      <output class="boot-status">loading…</output>
    </div>

    <div id="blazor-error-ui" role="alert">
      <section class="runtime-error" aria-label="Application error">
        <div class="runtime-error-copy">
          <p class="runtime-error-location"><span class="runtime-error-user">guest@portfolio</span> <span class="runtime-error-path">~</span></p>
          <p class="runtime-error-command"><span class="runtime-error-success">(0)</span> <span aria-hidden="true">→</span> nvim .</p>
          <p class="runtime-error-title">error: The portfolio encountered an unexpected application error.</p>
          <p class="runtime-error-message">Press Enter to run it again. If it keeps happening, try later.</p>
          <p class="runtime-error-location"><span class="runtime-error-user">guest@portfolio</span> <span class="runtime-error-path">~</span></p>
          <div class="runtime-error-actions">
            <span class="runtime-error-status">(1)</span>
            <span class="runtime-error-arrow" aria-hidden="true">→</span>
            <a href="." class="reload" title="Run again (Enter)">nvim .</a><span class="runtime-error-cursor" aria-hidden="true"></span>
            <button type="button" class="dismiss" title="Hide this message without restarting the app">clear</button>
          </div>
        </div>
      </section>
    </div>
    <script>
      document.addEventListener("keydown", event => {
        const errorUi = document.getElementById("blazor-error-ui");
        if (event.key !== "Enter" || getComputedStyle(errorUi).display === "none") return;
        if (event.target.closest?.("#blazor-error-ui .dismiss")) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        location.reload();
      }, true);
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
  </body>
</html>
