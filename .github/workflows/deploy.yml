name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly native tools
        run: dotnet workload install wasm-tools
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Subset application symbol font
        run: |
          python -m pip install -r src/tools/font-requirements.txt
          python src/tools/subset-symbol-font.py
          python -m unittest discover -s tests/tools
      # Minify before publishing so asset hashes and compressed copies match.
      - name: Minify application JavaScript
        run: >-
          npm exec --yes --package=esbuild@0.28.2 -- esbuild
          "src/Srv.Portfolio/wwwroot/js/*.js"
          "src/Srv.Portfolio/Pages/*.razor.js"
          --outbase=src/Srv.Portfolio
          --outdir=src/Srv.Portfolio
          --allow-overwrite
          --minify
          --format=esm
          --legal-comments=none
      - name: Pre-render external READMEs
        run: >-
          dotnet run --project src/Srv.Portfolio.ContentGenerator -c Release --
          --readmes src/Srv.Portfolio/wwwroot
      - name: Pre-highlight README code blocks
        run: node src/tools/highlight-readme-snapshots.mjs src/Srv.Portfolio/wwwroot
      - name: Publish portfolio
        run: dotnet publish src/Srv.Portfolio -c Release -o out
      - name: Prepare GitHub Pages assets
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          sed -i "s|<base href=\"/\" />|<base href=\"${PAGES_BASE_PATH}/\" />|" out/wwwroot/index.html
          touch out/wwwroot/.nojekyll
          printf 'sravio.li\n' > out/wwwroot/CNAME
          cp out/wwwroot/index.html out/wwwroot/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
